prompt: |
  Welcome to the ttnn_models project! Take your time to read the source code and understand it. This is based on tt-metal and ttnn. You can find the tt-metal source in /proj_sw/user_dev/moconnor/tt-metal/ if you need to look something up.

  Our task today is to run the demo (for TTFT and t/s/u) and long eval test (for top-1 and top-5, use --max_new_tokens 100 --prompt_file prompts/bringup_eval_long.txt) for a model and update the appropriate part of the table in MODELS.md. You should also check the output of the demo looks sensible and is not clearly garbage or corrupted. If it is bad, replace the top-1 and top-5 scores with 'bad'.
  
  Important for 1x8 mesh port issues:
  - If the issue title/body includes "1x8 mesh port", you must update the target model's model.py to set `MESH_SHAPE = (1, 8)` and adjust any mesh-axis/sharding assumptions accordingly *before* running demo/eval. Do not run metrics on the old 2x4 mesh.

  Notes:
  - Always produce demo.log and eval.log, even if the command fails (capture stdout/stderr, then continue).
  - If you see `cannot map elf file into memory: No space left on device`, rerun with `TT_METAL_CACHE=/tmp/tt-metal-cache` and `TT_METAL_RUNTIME_ROOT=/proj_sw/user_dev/moconnor/tt-runtime-root`.
  - If you see TT JIT compile errors in `llk_*` headers (e.g. `_llk_unpack_untilize_init_` arg mismatch), run:
    `cd /proj_sw/user_dev/moconnor/tt-metal && git submodule update --init --recursive`
    and then rerun demo/eval.

  The details for the model we are running are {{item}}.

  Deliverables:
  - Updated MODELS.md with TTFT, t/s/u, top-1 and top-5 columns filled in.
  - demo.log and eval.log files in the model's own directory start with the command run and then containing the output of the demo/eval runs respectively.
check: |
  Output EXACTLY one line of JSON, and nothing else.
  - First character MUST be "{"
  - Last character MUST be "}"
  - No code fences, no markdown, no extra text
  - 'reason' must be a single line (no newlines)

  Choose exactly one output (copy the format exactly):
  {"success": true, "reason": "PASS"}
  {"success": false, "reason": "FAIL: <single line reason>"}

  Do NOT run any tests or TT/TTNN workloads (no demo/eval, no tt-smi) and do NOT download models.
  Use only repository evidence (files and diffs) to verify completion against the task intent.

  Pass criteria:
  1. Target model directory from the task details has both demo.log and eval.log.
  2. demo.log starts with the demo command and includes TTFT + decode t/s/u output.
  3. eval.log starts with the eval command and includes Top-1 + Top-5 accuracy output.
  4. MODELS.md has the target row updated with Top-1, Top-5, TTFT, t/s/u, and Seq len values from the run artifacts.
  5. Demo output text is coherent enough to not be obviously corrupted; if it is clearly corrupted, MODELS.md uses 'bad' for Top-1 and Top-5.
  6. If the issue indicates a 1x8 mesh port (title/body contains "1x8 mesh port"), the target model.py sets `MESH_SHAPE = (1, 8)` (not 2x4).
set_up: |
  Make sure you are in /localdev/moconnor/ttnn_models
  If there are any unsaved changes, stash them and be sure to mention it in your output.
  Create and switch to a new branch named test_<sanitized_title>, where <sanitized_title> is the issue title with the leading 'models/' stripped and slashes replaced by dashes: {{item}}
  Run 'tt-smi -r' to reset the device.
  Run 'tt-smi -ls' and confirm the expected board(s) are visible before running demo/eval.
on_success: |
  Add, commit and push MODELS.md and the demo and eval log files, remove anything in generated/.
  Open a PR that auto-closes the issue by including `Fixes #<issue-number>` on its own line in the PR body.
  Use `gh pr create --body-file ...` (not `--body` with `\n` escapes) so GitHub recognizes the closing keyword.
on_failure: |
  Add, commit and push MODELS.md and the demo and eval log files
tear_down: |
  Switch back to the main branch and leave the repo is in a clean state, e.g. no temporary files etc.
